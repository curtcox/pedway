name: Data refresh
# Builds a new data snapshot from OpenStreetMap once a month and opens (or
# updates) a pull request that adds it and moves data/current.json to it. Data
# never changes on main without review. data-tag.yml tags it once merged.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".
on:
  schedule:
    - cron: '17 9 3 * *'   # 09:17 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      groups:
        description: 'What to rebuild: core (Pedway, entrances, stations), poi, base (downtown map and corners)'
        default: 'core,poi'
permissions:
  contents: read
concurrency:
  group: data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      # The monthly run rebuilds the Pedway, stations and places. The downtown base map
      # changes slowly and needs five more large Overpass queries, so it is rebuilt only
      # when the workflow is run by hand with groups including base (docs/map-layers.md).
      - run: npm run data:build -- --only "$GROUPS"
        env:
          GROUPS: ${{ inputs.groups || 'core,poi' }}
      - run: npm run data:check
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A refresh only adds files (store blobs and a snapshot manifest) and rewrites
          # data/current.json, so look for untracked files too.
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "OpenStreetMap data is unchanged."
            exit 0
          fi
          id=$(node -p "require('./data/current.json').snapshot")
          node scripts/data-diff.mjs > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Branch from the newest main, not the commit this run started on: if main moved
          # (say, a workflow edit), an older base would look like a workflow change, which
          # the workflow token may not push. Snapshots are add-only, so copying ours over
          # main's data keeps anything main gained meanwhile.
          cp -R data "$RUNNER_TEMP/data"
          git checkout -- data && git clean -fdq -- data
          git fetch --quiet origin main
          git switch -C data-refresh FETCH_HEAD
          cp -R "$RUNNER_TEMP/data/." data/
          git add data
          git commit -m "Add data snapshot $id from OpenStreetMap"
          git push --force origin data-refresh
          if [ "$(gh pr view data-refresh --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit data-refresh --title "Data snapshot $id from OpenStreetMap" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --head data-refresh --base main --title "Data snapshot $id from OpenStreetMap" --body-file "$RUNNER_TEMP/summary.md"
          fi
